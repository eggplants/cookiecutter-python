{%- set docker = cookiecutter.use_docker == "yes" and cookiecutter.project_type == "cli" -%}
{%- set on_release = cookiecutter.use_pyinstaller == "yes" and cookiecutter.project_type == "cli" -%}
{%- set tag_ref = '${{ needs.resolve.outputs.tag }}' if on_release else '${{ github.ref_name }}' -%}
{%- set release_dep = 'resolve' if on_release else 'release' -%}
{%- set merge_dep = '[resolve, ghcr]' if on_release else 'ghcr' -%}
{%- raw -%}
name: release
{%- endraw %}
{%- if on_release %}
{%- raw %}

on:
  release:
    types: [published]
  workflow_run:
    workflows: [build-binaries]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, e.g. v0.0.1
        required: true
        type: string
{%- endraw %}
{%- else %}
{%- raw %}

on:
  push:
    tags:
      - "v*.*.*"
{%- endraw %}
{%- endif %}
{%- raw %}

permissions:
  contents: read

jobs:
{%- endraw %}
{%- if on_release %}
{%- raw %}
  resolve:
    name: resolve the tag
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "${{ github.event_name }}" in
            release) tag="$RELEASE_TAG" ;;
            workflow_run) tag="$RUN_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
          esac
          if [ -z "$tag" ]; then
            echo "could not work out which tag to release" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
{% endraw %}
{%- else %}
{%- raw %}
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          prerelease: false
{% endraw %}
{%- endif %}
{%- raw %}
  pypi:
{%- endraw %}
    needs: {{ release_dep }}
{%- raw %}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
{%- endraw %}
          ref: {{ tag_ref }}
{%- raw %}
          fetch-depth: 0
      - name: Drop the tools mise.toml marks as local-only
        run: sed -i '/# \[skip ci\]/d' mise.toml
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: uv sync --locked --no-dev
      - run: mise run build
      - run: uv publish
{%- endraw %}
{%- if docker %}
{%- raw %}

  # Each architecture is built on its own native runner and pushed by digest
  # only; `ghcr-merge` joins the digests into one tagged manifest list. Native
  # runners beat QEMU emulation by a wide margin for anything that compiles.
  ghcr:
    name: build ${{ matrix.platform }}
{%- endraw %}
    needs: {{ release_dep }}
{%- raw %}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
{%- endraw %}
          ref: {{ tag_ref }}
{%- raw %}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
{%- endraw %}
            VERSION={{ tag_ref }}
{%- raw %}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.os }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  ghcr-merge:
    name: push multi-arch manifest
{%- endraw %}
    needs: {{ merge_dep }}
{%- raw %}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
{%- endraw %}
            type=semver,pattern={% raw %}{{version}}{% endraw %},value={{ tag_ref }}
            type=semver,pattern={% raw %}{{major}}.{{minor}}{% endraw %},value={{ tag_ref }}
{%- raw %}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list and push it
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect the pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
{%- endraw %}
{%- endif %}
