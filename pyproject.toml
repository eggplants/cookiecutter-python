[project]
name = "cookiecutter-python"
version = "0.0.0"
description = "A Cookiecutter template for eggplants' Python projects"
readme = "README.md"
keywords = [
  "cookiecutter",
  "cookiecutter-template",
  "project-template",
  "python-template",
  "scaffolding",
  "template",
]
license = { text = "MIT" }
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = []
urls.Documentation = "https://egpl.dev/cookiecutter-python/"
urls.Issues = "https://github.com/eggplants/cookiecutter-python/issues"
urls.Repository = "https://github.com/eggplants/cookiecutter-python"

[dependency-groups]
dev = [
  "cookiecutter>=2.6",
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pyyaml>=6",
]

[tool.uv]
python-downloads = "never"
exclude-newer = "P7D"
package = false
preview = true

[tool.ruff]
line-length = 120
# The template tree is Jinja, not Python: `{% if %}` in a .py file is a syntax error.
extend-exclude = [ "*project_slug*" ]
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "D",
]
lint.per-file-ignores."hooks/*.py" = [
  "INP001", # Implicit namespace package (Cookiecutter runs these as scripts)
  "T201",   # `print` found (hook output is the user-facing feedback)
]
lint.per-file-ignores."tests/**" = [
  "ANN",     # Missing type annotations (tests/fixtures)
  "ARG",     # Unused arguments (pytest fixtures)
  "INP001",  # Implicit namespace package (no __init__ in tests)
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
]
lint.pydocstyle.convention = "google"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
